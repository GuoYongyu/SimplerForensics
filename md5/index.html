<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MD5 字典匹配 · SimplerForensic</title><link rel="stylesheet" href="../assets/style.css"><link rel="icon" type="image/x-icon" href="../assets/favicon.ico"><script defer src="../assets/nav.js?v=20261015-4"></script><script defer src="../assets/custom-select.js"></script><script defer src="app.js"></script></head><body><header class="topbar"><a class="brand" href="../index.html"><img class="brand-logo" src="../assets/icons/brand.svg" alt=""><span>SimplerForensic<small>LOCAL TOOLKIT</small></span></a><span class="local-badge"><i></i> 仅在本地运行</span></header><main class="page-shell"><div class="breadcrumbs"><a href="../index.html">工具集</a><span>›</span><span>MD5 字典匹配</span></div><section class="page-heading"><div><p class="kicker">03 / LOCAL DICTIONARY</p><h1>MD5 字典匹配</h1><p>对输入哈希进行本地字典匹配。哈希不可逆；这里只验证字典中的候选文本。</p></div><span class="chip">最多 8 个 Worker</span></section><section class="panel"><label class="field-label" for="hashes">MD5 哈希（每行一个，32 位十六进制）</label><textarea id="hashes" style="min-height:120px" placeholder="5d41402abc4b2a76b9719d911017c592"></textarea><div class="field-row" style="margin-top:17px"><div style="flex:2"><span class="field-label">本地字典目录</span><input class="visually-hidden-file" id="folder" type="file" webkitdirectory directory multiple accept=".txt,text/plain"><button class="btn choose-files" type="button" data-pick="folder">选择字典目录</button></div><div style="flex:2"><span class="field-label">或选择 TXT 字典</span><input class="visually-hidden-file" id="files" type="file" multiple accept=".txt,text/plain"><button class="btn choose-files" type="button" data-pick="files">选择 TXT 文件</button></div><label style="flex:1"><span class="field-label">并行线程数</span><select id="threads"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label></div><p class="hint">字典仅从你选择的本地目录或 TXT 文件读取，不会上传；按文件名顺序逐行匹配，README 文件会跳过。</p><div id="dictionary-list" class="dictionary-list"><h3>已读取字典（0）</h3><div class="empty">尚未选择 TXT 字典</div></div><div class="button-row"><button class="btn btn-primary" id="start">开始匹配</button><button class="btn" id="stop" disabled>停止</button><button class="btn" id="clear">清空结果</button></div><div class="progress"><span id="progress"></span></div><div id="status" class="status">等待输入哈希和选择字典。</div></section><section class="panel"><h2>匹配结果</h2><div id="results" class="result-box">尚无结果</div><div class="button-row"><button class="btn" id="copy">复制结果</button></div></section><footer class="tool-footer">版权所有 Star Rain (GYY)</footer></main></body></html>
