<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>文件格式速查 · SimplerForensic</title><link rel="stylesheet" href="../assets/style.css"><link rel="icon" type="image/x-icon" href="../assets/favicon.ico"><script defer src="../assets/nav.js?v=20261015-4"></script><script defer src="../assets/custom-select.js"></script><script defer src="app.js"></script></head><body><header class="topbar"><a class="brand" href="../index.html"><img class="brand-logo" src="../assets/icons/brand.svg" alt=""><span>SimplerForensic<small>LOCAL TOOLKIT</small></span></a><span class="local-badge"><i></i> 仅在本地运行</span></header><main class="page-shell"><div class="breadcrumbs"><a href="../index.html">工具集</a><span>›</span><span>文件格式速查</span></div><section class="page-heading"><div><p class="kicker">04 / SIGNATURE REFERENCE</p><h1>文件格式速查</h1><p>查询常见文件头、文件尾签名，以及可识别的元数据字段和字节偏移。</p></div><span class="chip" id="count"></span></section><section class="panel"><label class="field-label" for="query">按格式名、扩展名、十六进制签名或字段搜索</label><div class="field-row"><input class="field" id="query" placeholder="例如：PNG、.pdf、89 50 4E 47、宽度"><select id="category" style="max-width:220px"><option value="">所有类别</option><option>图片</option><option>压缩包</option><option>办公文档</option><option>PDF</option><option>音频</option><option>视频</option><option>音视频</option><option>其他</option></select></div><div id="results" style="margin-top:18px"></div></section><details class="panel"><summary style="cursor:pointer;color:#d7e9fa">添加自定义签名记录</summary><p class="hint">自定义记录仅保存在当前浏览器。十六进制字节可用空格分隔；字段说明可填写偏移和解释。</p><div class="tool-layout"><label><span class="field-label">格式名称</span><input class="field" id="customName" placeholder="例如：自定义容器"></label><label><span class="field-label">扩展名</span><input class="field" id="customExt" placeholder="例如：.abc"></label><label><span class="field-label">类别</span><select class="field" id="customCat"><option>图片</option><option>压缩包</option><option>办公文档</option><option>PDF</option><option>音频</option><option>视频</option><option>音视频</option><option>其他</option></select></label><label><span class="field-label">文件头（十六进制）</span><input class="field" id="customHead" placeholder="AA BB CC"></label><label><span class="field-label">文件尾（十六进制，可选）</span><input class="field" id="customTail" placeholder="可留空"></label><label><span class="field-label">已知字段及偏移（可选）</span><input class="field" id="customFields" placeholder="宽度：偏移 0x10，4 字节，大端"></label></div><div class="button-row"><button class="btn btn-primary" id="add">保存自定义记录</button><button class="btn" id="reset">删除所有自定义记录</button></div><div id="status" class="status" hidden></div></details><footer class="tool-footer">版权所有 Star Rain (GYY)</footer></main></body></html>
