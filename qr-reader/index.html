<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>二维码识别 · SimplerForensic</title>
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
  <script defer src="../assets/nav.js?v=20261015-4"></script>
  <script defer src="../assets/vendor/jsQR.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html"><img class="brand-logo" src="../assets/icons/brand.svg" alt=""><span>SimplerForensic<small>LOCAL TOOLKIT</small></span></a>
    <span class="local-badge"><i></i> 仅在本地运行</span>
  </header>
  <main class="page-shell">
    <div class="breadcrumbs"><a href="../index.html">工具集</a><span>›</span><span>二维码识别</span></div>
    <section class="page-heading">
      <div><p class="kicker">08 / QR CODE READER</p><h1>二维码识别</h1><p>上传二维码图片，读取其中的文本、网址或其他信息。</p></div>
      <span class="chip">离线识别</span>
    </section>
    <section class="panel">
      <div class="drop-zone" id="drop" tabindex="0" role="button" aria-label="选择或拖放二维码图片">
        <strong>拖动二维码图片到这里</strong>
        <span class="hint">也可以点击选择图片；文件只在浏览器本地处理，不会上传。</span>
        <input class="file-input" id="file" type="file" accept="image/*" aria-label="选择二维码图片">
      </div>
      <div id="status" class="status" role="status" aria-live="polite">选择一张包含二维码的图片开始识别。</div>
    </section>
    <section class="tool-layout" id="result-layout" hidden>
      <section class="panel qr-preview-panel">
        <h2>图片预览</h2>
        <img id="preview" class="image-preview" alt="待识别的二维码图片">
        <div id="image-info" class="subtle qr-image-info"></div>
      </section>
      <section class="panel">
        <h2>识别结果</h2>
        <textarea id="output" class="qr-output" readonly aria-label="二维码识别内容" placeholder="识别到的内容会显示在这里"></textarea>
        <div class="button-row"><button class="btn btn-primary" id="copy" disabled>复制内容</button><button class="btn" id="clear">清空</button></div>
      </section>
    </section>
    <footer class="tool-footer">版权所有 Star Rain (GYY)</footer>
  </main>
  <script defer src="../assets/back-to-top.js?v=20261018-1"></script>
</body>
</html>
